[package]
name = "seer-core"
version = { workspace = true }
edition = { workspace = true }

[lib]
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
once_cell = "1.21.3"
solana-instruction = "3.1"
solana-pubkey = { version = ">=4.2.0,<4.3.0", default-features = false }
solana-program = { version = "3.0.0", default-features = false }
solana-keypair = "^3.0.0" 
solana-signature = "3.0.12"
solana-instruction-error = { version = "2.0.0", features = ["serde"] }
seer-interface = { workspace = true }
gimli = "0.32.3"
rustc-demangle = "0.1.26"
anyhow = "1.0.99"
object = "0.38.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
bincode = "1.3.3"
memmap2 = "0.9.7"
typed-arena = "2.0.2"
regex = "1.11.1"
fallible-iterator = "0.3.0"
solana-signer = "3.0.0"
log = "0.4.27"
solana-account = { version = ">=4.3.1,<4.4.0", features = ["serde"] }
path-clean = "1.0.1"
serde_with = "3.16.1"
chrono = "0.4.42"
pathdiff = "0.2"
codama-nodes = "0.8.0"
byteorder = "1.5.0"
hex = "0.4.3"
bs58 = "0.5.1"
base64 = "0.22.1"
thiserror = "2.0.18"
anchor-lang-idl-spec = "0.1.0"
anchor-lang = { version = "0.32.1", default-features = false }
disasm = { path = "../disasm", optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
solana-loader-v3-interface = "3.0.0"
flate2 = "1.0"
tempfile = "3"
storage = { path = "../storage" }

[features]
default = ["disasm"]
disasm = ["dep:disasm"]

[[test]]
name = "codama_idl"
path = "tests/idl/codama.rs"

[[test]]
name = "anchor_idl"
path = "tests/idl/anchor.rs"

[lints]
workspace = true
