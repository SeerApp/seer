[package]
name = "seer-core"
version = "0.8.2"
edition.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
once_cell = "1.21.3"
solana-instruction = "3.0.0"
solana-pubkey = { version = "3.0.0", default-features = false }
solana-program = { version = "3.0.0", default-features = false }
solana-keypair = "=3.0.0" 
solana-signature = "3.0.12"
solana-instruction-error = { version = "2.0.0", features = ["serde"] }
seer-interface = { workspace = true }
gimli = "0.32.3"
rustc-demangle = "0.1.26"
anyhow = "1.0.99"
object = "0.38.0"
serde = "1.0.219"
serde_json = "1.0.142"
memmap2 = "0.9.7"
typed-arena = "2.0.2"
regex = "1.11.1"
fallible-iterator = "0.3.0"
solana-signer = "3.0.0"
log = "0.4.27"
solana-account = { version = "=3.0.0", features = ["serde"] }
path-clean = "1.0.1"
serde_with = "3.16.1"
chrono = "0.4.42"
pathdiff = "0.2"

[lints]
workspace = true
