[package]
name = "decode"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
# Agave pulls `solana-*` crates that require a recent toolchain (see `cargo build` errors).
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[dependencies]
# Same release line as the Seer-patched Agave.
solana-syscalls = { version = "4.2.1", default-features = false, features = ["agave-unstable-api"] }
anyhow = "1.0"
object = "0.38.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
solana-program-runtime = { version = "4.2.1", default-features = false, features = ["agave-unstable-api"] }
solana-svm-feature-set = { version = "4.2.1", features = ["agave-unstable-api"] }
storage = { path = "../storage" }

[lints]
workspace = true
