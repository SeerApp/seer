[package]
name = "trace"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
solana-instruction = "3.1"
solana-pubkey = { version = ">=4.2.0,<4.3.0", default-features = false }
solana-program = { version = "3.0.0", default-features = false }
solana-keypair = "^3.0.0"
solana-instruction-error = { version = "2.0.0", features = ["serde"] }
hooks = { workspace = true }
gimli = "0.32.3"
rustc-demangle = "0.1.26"
hex = "0.4.3"
object = "0.38.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
bincode = "1.3.3"
memmap2 = "0.9.7"
typed-arena = "2.0.2"
regex = "1.11.1"
fallible-iterator = "0.3.0"
solana-signer = "3.0.0"
log = "0.4.27"
solana-account = { version = ">=4.3.1,<4.4.0", features = ["serde"] }
path-clean = "1.0.1"
serde_with = "3.16.1"
pathdiff = "0.2"
logger = { path = "../logger" }
thiserror = "2.0.18"
solana-loader-v3-interface = { version = "8.0.1", features = ["serde"] }
storage = { path = "../storage" }

[lints]
workspace = true
