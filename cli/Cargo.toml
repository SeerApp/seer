[package]
name = "seer"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[[bin]]
name = "seer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4.3"
litesvm = { git = "https://github.com/SeerApp/litesvm", branch = "patch-0.16.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
trace = { path = "../trace" }
idl = { path = "../idl" }
decode = { path = "../decode" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
storage = { path = "../storage" }
glassbox = { path = "../glassbox" }
wincode = "0.5.5"
agave-feature-set = { version = "=4.2.1", features = ["agave-unstable-api"] }
agave-reserved-account-keys = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-syscalls = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-account = ">=4.3.1,<4.4.0"
solana-address = "~2.6.1"
solana-address-lookup-table-interface = { version = "~3.1.0", features = ["bincode", "bytemuck"] }
solana-bpf-loader-program = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-builtins = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-clock = "~3.1.1"
solana-compute-budget = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-compute-budget-instruction = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-fee = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-hash = { version = "4", features = ["decode"] }
solana-loader-v3-interface = { version = "8.0.1", features = ["serde"] }
solana-message = "4.2.4"
solana-program-runtime = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-pubkey = { version = ">=4.2.0,<4.3.0", features = ["serde"] }
solana-rpc-client = { version = "=4.2.1", default-features = false }
solana-sdk-ids = "3"
solana-signature = "~3.4.1"
solana-slot-hashes = "3"
solana-stake-history = "1.0.0"
solana-svm-callback = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-svm-log-collector = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-svm-timings = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-svm-transaction = ">=4.2.0,<4.3.0"
solana-system-program = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-sysvar = "~4.1.0"
solana-transaction = { version = "4.1.5", features = ["serde", "wincode", "verify"] }
solana-transaction-context = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-transaction-status-client-types = { version = "=4.2.1", features = ["agave-unstable-api"] }

[lints]
workspace = true
