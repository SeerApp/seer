name: test

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.1

      - name: Linux tools
        run: sudo apt-get update && sudo apt-get install -y pkg-config unzip

      - name: Test
        shell: bash
        run: |
          set -eu
          ROOT=$(pwd)
          PIN="$ROOT/z3-pin"
          TARGET=x86_64-unknown-linux-gnu
          VERSION=$(awk -F= '/^VERSION=/ { print $2; exit }' "$PIN")
          set -- $(awk -v t="$TARGET" '$1 == t { print $2, $3; found=1 } END { if (!found) exit 1 }' "$PIN")
          ASSET=$1
          EXPECT=$2
          URL="https://github.com/Z3Prover/z3/releases/download/z3-${VERSION}/${ASSET}"
          CACHE="${Z3_CACHE:-$ROOT/dist/.z3}"
          mkdir -p "$CACHE"
          ZIP="$CACHE/$ASSET"
          if [ ! -f "$ZIP" ]; then
            curl -fsSL -o "$ZIP" "$URL"
          fi
          GOT=$(sha256sum "$ZIP" | awk '{print $1}')
          [ "$GOT" = "$EXPECT" ]
          Z3ROOT="$CACHE/${ASSET%.zip}"
          if [ ! -f "$Z3ROOT/include/z3.h" ]; then
            rm -rf "$Z3ROOT"
            unzip -q "$ZIP" -d "$CACHE"
          fi
          [ -f "$Z3ROOT/include/z3.h" ]
          Z3BIN="$Z3ROOT/bin"
          if [ -f "$Z3BIN/libz3.a" ]; then
            mv "$Z3BIN/libz3.a" "$Z3BIN/libz3.a.bak"
          fi
          PC="$CACHE/pkgconfig"
          mkdir -p "$PC"
          {
            echo "prefix=$Z3ROOT"
            echo "libdir=$Z3BIN"
            echo "includedir=$Z3ROOT/include"
            echo "Name: z3"
            echo "Description: pinned Z3"
            echo "Version: $VERSION"
            echo 'Libs: -L${libdir} -lz3'
            echo 'Cflags: -I${includedir}'
          } >"$PC/z3.pc"
          export PKG_CONFIG_LIBDIR="$PC"
          export PKG_CONFIG_PATH="$PC"
          export Z3_SYS_Z3_HEADER="$Z3ROOT/include/z3.h"
          export Z3_LIBRARY_PATH_OVERRIDE="$Z3BIN"
          export LD_LIBRARY_PATH="$Z3BIN${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --workspace -- --test-threads=1
