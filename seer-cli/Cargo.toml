[package]
name = "seer-cli"
version = { workspace = true }
edition = { workspace = true }

[[bin]]
name = "seer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
serde_json = "1.0.142"
solana-transaction = { version = "3.0.0", features = ["serde"] }

[lints]
workspace = true
