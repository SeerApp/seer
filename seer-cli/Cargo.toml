[package]
name = "seer-cli"
version = { workspace = true }
edition = { workspace = true }

[[bin]]
name = "seer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
hex = "0.4.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
solana-address-lookup-table-interface = { version = "4", features = ["bincode", "bytemuck"] }
solana-loader-v3-interface = { version = "6", features = ["serde"] }
solana-message = "3"
solana-pubkey = { version = "4", features = ["serde"] }
solana-sdk-ids = "3"
solana-transaction = { version = "3.0.0", features = ["serde"] }

[lints]
workspace = true
