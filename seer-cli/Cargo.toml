[package]
name = "seer-cli"
version = { workspace = true }
edition = { workspace = true }

[[bin]]
name = "seer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
litesvm = { path = "../../litesvm/crates/litesvm" }
rusqlite = { version = "0.32", features = ["bundled"] }
seer-core = { path = "../seer-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
storage = { path = "../storage" }
agave-feature-set = "=3.1.6"
agave-reserved-account-keys = "=3.1.6"
agave-syscalls = "=3.1.6"
solana-account = "3.2"
solana-address = "2.0"
solana-address-lookup-table-interface = { version = "4", features = ["bincode", "bytemuck"] }
solana-bpf-loader-program = "=3.1.6"
solana-builtins = "=3.1.6"
solana-clock = "3"
solana-compute-budget = "=3.1.6"
solana-compute-budget-instruction = "=3.1.6"
solana-fee = "=3.1.6"
solana-hash = { version = "4", features = ["decode"] }
solana-loader-v3-interface = { version = "6", features = ["serde"] }
solana-message = "3"
solana-program-runtime = "=3.1.6"
solana-pubkey = { version = "4", features = ["serde"] }
solana-rpc-client = { path = "../../agave/rpc-client", default-features = false }
solana-sdk-ids = "3"
solana-signature = "3.0.12"
solana-slot-hashes = "3"
solana-stake-interface = "2.0.1"
solana-svm-callback = "=3.1.6"
solana-svm-log-collector = "=3.1.6"
solana-svm-timings = "=3.1.6"
solana-svm-transaction = "=3.1.6"
solana-system-program = "=3.1.6"
solana-sysvar = "3"
solana-transaction = { version = "3.0.0", features = ["serde"] }
solana-transaction-context = "=3.1.6"

[lints]
workspace = true
