[package]
name = "seer-cli"
version = { workspace = true }
edition = { workspace = true }

[[bin]]
name = "seer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
solana-pubkey = { version = "4", features = ["serde"] }
solana-transaction = { version = "3.0.0", features = ["serde"] }

[lints]
workspace = true
